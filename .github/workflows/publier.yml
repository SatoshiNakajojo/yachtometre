# Publie le Yachtomètre sur GitHub Pages à chaque modification.
#
# Ce que ça change concrètement : tu peux corriger une réplique directement
# dans contenu.json depuis le site de GitHub, sur ton téléphone. Deux minutes
# plus tard l'adresse publique est à jour, sans terminal.
name: Publier le Yachtomètre

on:
  push:
    branches: [main]
    # Les fichiers régénérés par le build ne relancent pas le build.
    paths-ignore: ['yachtometre.html', 'index.html', 'sw.js']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Les générateurs d'images rendent souvent du JPEG. Le détourage ne sait
      # lire que le PNG, et sans détourage l'échelle du bateau est fausse.
      - name: Convertir les illustrations en PNG
        run: |
          pip install --quiet --disable-pip-version-check Pillow || true
          python3 outils/en_png.py

      - name: Détourer et recadrer les illustrations
        run: python3 outils/recadrer.py

      - name: Comprimer les illustrations
        run: python3 outils/comprimer.py

      - name: Régénérer le jeu depuis contenu.json
        run: python3 build.py

      - name: Reporter le build dans le dépôt
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "build : régénération depuis contenu.json"
            git push
          fi

      - name: Rassembler le site
        run: |
          mkdir -p _site
          cp index.html yachtometre.html manifest.webmanifest sw.js _site/
          cp -r icones _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4
